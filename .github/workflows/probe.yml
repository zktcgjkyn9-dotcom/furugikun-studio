name: メルカリ取り込みテスト
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["studio/fetch_item.py", "studio/render_probe.py", ".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.49.1 && python -m playwright install --with-deps chromium
      - run: python studio/render_probe.py m47148845481
