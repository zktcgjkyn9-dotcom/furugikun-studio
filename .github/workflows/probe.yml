name: 調査用
on:
  push:
    branches: [main]
    paths: ["studio/probe_auction.py", ".github/workflows/probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright==1.49.1 && python -m playwright install --with-deps chromium
      - run: python studio/probe_auction.py m98997916211 m87280386225
