name: 古着くん動画を作る

on:
  workflow_dispatch:
    inputs:
      url:
        description: "メルカリの商品URL（空欄なら出品者ページから新しい出品を探す）"
        required: false
        default: ""
      approve:
        description: "承認する投稿のID・商品ID（全部なら all）"
        required: false
        default: ""
      variant:
        description: "同じ商品で別パターンの動画を作るときは 1, 2 …"
        required: false
        default: "0"
  schedule:
    - cron: "0 */2 * * *"   # 2時間ごと:新着確認・投稿・成果の記録
  push:
    branches: [main]
    paths: ["items/**/item.json", "items/**/photos/**", "bgm/**"]

concurrency:
  group: make-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
      TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
      TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
      TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pythonの部品を入れる
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 投稿を承認する
        if: inputs.approve != ''
        run: python studio/social.py approve "${{ inputs.approve }}"

      - name: メルカリから商品を取り込む
        if: github.event_name != 'push' && inputs.approve == ''
        env:
          URL: ${{ inputs.url }}
        run: |
          if [ -n "$URL" ]; then
            python studio/fetch_item.py "$URL"
          elif [ -f items/.seller ]; then
            python studio/fetch_item.py --seller
            python studio/fetch_item.py --refresh 6
          fi

      - name: 動画にする商品を調べる
        id: plan
        env:
          URL: ${{ inputs.url }}
        run: |
          if [ -n "$URL" ]; then
            IDS=$(python -c "import re,os;print(re.search(r'(m\d{8,})', os.environ['URL']).group(1))")
          else
            IDS=$(python studio/build.py --list-pending)
          fi
          echo "作成対象: ${IDS:-なし}"
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

      - name: VOICEVOXエンジンを起動
        if: steps.plan.outputs.ids != ''
        run: |
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:50021/version; then echo " 起動OK"; break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:50021/version

      - name: 描画ツールと日本語フォントを入れる
        if: steps.plan.outputs.ids != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin ffmpeg fonts-noto-cjk fonts-noto-cjk-extra

      - name: 動画を作る
        if: steps.plan.outputs.ids != ''
        run: python studio/build.py ${{ steps.plan.outputs.ids }} --variant "${{ inputs.variant || '0' }}"

      - name: 投稿予定・投稿・成果の記録・管理画面
        if: always()
        run: |
          python studio/social.py plan
          python studio/social.py post
          python studio/social.py metrics || true
          python studio/social.py analyze || true
          python studio/social.py status

      - name: 保存
        if: always()
        run: |
          git config user.name "furugikun-bot"
          git config user.email "furugikun-bot@users.noreply.github.com"
          git add items outputs posting metrics STATUS.md
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "自動更新 ($(TZ=Asia/Tokyo date +%m/%d\ %H:%M))"
          git pull --rebase -X theirs origin main
          git push
