name: 古着くん動画を作る

on:
  workflow_dispatch:
    inputs:
      url:
        description: "メルカリの商品URL（空欄なら出品者ページから新しい出品を探す）"
        required: false
        default: ""
  schedule:
    - cron: "0 */2 * * *"   # 2時間ごとに新しい出品を確認
  push:
    branches: [main]
    paths: ["items/**/item.json", "items/**/photos/**", "studio/**", "bgm/**", "requirements.txt"]

concurrency:
  group: make-video
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pythonの部品を入れる
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: メルカリから商品を取り込む
        if: github.event_name != 'push'
        env:
          URL: ${{ inputs.url }}
        run: |
          if [ -n "$URL" ]; then
            python studio/fetch_item.py "$URL"
          elif [ -f items/.seller ]; then
            python studio/fetch_item.py --seller
          else
            echo "出品者ページが未登録のため、新着の確認はスキップ"
          fi

      - name: 動画にする商品を調べる
        id: plan
        env:
          URL: ${{ inputs.url }}
        run: |
          if [ -n "$URL" ]; then
            IDS=$(python -c "import re,os;print(re.search(r'(m\d{8,})', os.environ['URL']).group(1))")
          else
            IDS=$(python studio/build.py --list-pending)
          fi
          echo "作成対象: ${IDS:-なし}"
          echo "ids=$IDS" >> "$GITHUB_OUTPUT"

      - name: VOICEVOXエンジンを起動
        if: steps.plan.outputs.ids != ''
        run: |
          docker run -d --name voicevox -p 127.0.0.1:50021:50021 voicevox/voicevox_engine:cpu-latest
          for i in $(seq 1 120); do
            if curl -sf http://127.0.0.1:50021/version; then echo " 起動OK"; break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:50021/version

      - name: 描画ツールと日本語フォントを入れる
        if: steps.plan.outputs.ids != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin ffmpeg fonts-noto-cjk fonts-noto-cjk-extra

      - name: 動画を作る
        if: steps.plan.outputs.ids != ''
        run: python studio/build.py ${{ steps.plan.outputs.ids }}

      - name: できた動画を保存（Actionsの成果物）
        if: always() && steps.plan.outputs.ids != ''
        uses: actions/upload-artifact@v4
        with:
          name: furugikun-videos
          path: outputs/
          if-no-files-found: ignore

      - name: 商品情報と動画をリポジトリに保存
        if: always()
        run: |
          git config user.name "furugikun-bot"
          git config user.email "furugikun-bot@users.noreply.github.com"
          git add items outputs
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git commit -m "取り込み・動画作成 ($(date +%m/%d\ %H:%M))"
          git pull --rebase origin main
          git push
